name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily freshness: a mid-week measured_at must fail the day it turns
    # 7 days old, not wait until the next Monday.
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pinned tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cooldown exceptions are within their dates
        run: |
          today=$(date -u +%F)
          expired=$(grep -oE 'Expires: [0-9]{4}-[0-9]{2}-[0-9]{2}' pnpm-workspace.yaml | awk -v t="$today" '$2 <= t { print $2 }' || true)
          if [ -n "$expired" ]; then
            echo "::error file=pnpm-workspace.yaml::cooldown exception past its expiry ($expired); delete it and re-check the lockfile"
            exit 1
          fi

      - name: Validate JSON is parseable
        run: node --input-type=module -e "import { readFileSync } from 'fs'; JSON.parse(readFileSync('schemas/edictum-v1.schema.json', 'utf8')); JSON.parse(readFileSync('schemas/edictum-v2.schema.json', 'utf8')); JSON.parse(readFileSync('invariants/adapter-versions.json', 'utf8'));"

      # edictum-v2.schema.json is the canonical schema (load_schema() returns
      # it); v1 is a deprecated compatibility alias. CI validated only the
      # alias, so a malformed canonical schema shipped green.
      # scripts/validate_schemas.mjs reproduces `ajv-cli compile --spec=draft2020`
      # on the pinned ajv; ajv-cli itself pulled in a vulnerable fast-json-patch.
      - name: Validate JSON Schema structure
        run: node scripts/validate_schemas.mjs schemas/edictum-v2.schema.json schemas/edictum-v1.schema.json

  test-python:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v4
        with:
          # Pinned so the duration form of exclude-newer in pyproject.toml
          # is parsed by a uv release known to support it. 0.13.4 is the
          # minimum fix for GHSA-hq85-5cpj-mr62, as in edictum.
          version: "0.13.4"

      # pytest and pyyaml are pinned in the "test" dependency group and locked
      # in uv.lock. pyyaml is required, not optional: without it every test
      # that reads fixture content skipped silently and the suite still
      # reported green. tests/conftest.py fails the run if anything skips
      # unexpectedly.
      - name: Install pinned test tools
        run: uv sync --frozen --group test

      - name: Validate adapter version record
        run: uv run --frozen --group test python scripts/check_adapter_versions.py

      - name: Run tests
        run: uv run --frozen --group test pytest tests/ -v -rs
