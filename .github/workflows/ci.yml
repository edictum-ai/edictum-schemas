name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily freshness: a mid-week measured_at must fail the day it turns
    # 7 days old, not wait until the next Monday.
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate JSON is parseable
        run: node --input-type=module -e "import { readFileSync } from 'fs'; JSON.parse(readFileSync('schemas/edictum-v1.schema.json', 'utf8')); JSON.parse(readFileSync('schemas/edictum-v2.schema.json', 'utf8')); JSON.parse(readFileSync('invariants/adapter-versions.json', 'utf8'));"

      # edictum-v2.schema.json is the canonical schema (load_schema() returns
      # it); v1 is a deprecated compatibility alias. CI validated only the
      # alias, so a malformed canonical schema shipped green.
      - name: Validate JSON Schema structure
        run: |
          npx ajv-cli@5.0.0 compile -s schemas/edictum-v2.schema.json --spec=draft2020
          npx ajv-cli@5.0.0 compile -s schemas/edictum-v1.schema.json --spec=draft2020

  test-python:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v4

      # pyyaml is required, not optional: without it every test that reads
      # fixture content skipped silently and the suite still reported green.
      # tests/conftest.py fails the run if anything skips unexpectedly.
      - name: Validate adapter version record
        run: uv run python scripts/check_adapter_versions.py

      - name: Run tests
        run: uv run --with pytest --with pyyaml pytest tests/ -v -rs
