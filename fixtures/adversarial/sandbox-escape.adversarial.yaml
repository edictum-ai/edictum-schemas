suite: sandbox-escape
version: 1
description: "Adversarial attempts to escape sandbox path restrictions"

fixtures:
  - id: "adv-sandbox-001"
    description: "Double-encoded path traversal must not bypass sandbox"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-project
          type: sandbox
          tool: "Write"
          within:
            - "/home/user/project"
          message: "Write restricted to project directory"

    envelope:
      tool_name: "Write"
      arguments:
        file_path: "/home/user/project/%2e%2e/%2e%2e/etc/passwd"

    expected:
      verdict: denied
      message_contains: "project directory"

  - id: "adv-sandbox-002"
    description: "Null byte injection in path must not bypass sandbox"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-project
          type: sandbox
          tool: "Write"
          within:
            - "/home/user/project"
          message: "Write restricted to project directory"

    envelope:
      tool_name: "Write"
      arguments:
        file_path: "/home/user/project/safe.txt\u0000../../etc/passwd"

    expected:
      verdict: denied
      message_contains: "project directory"

  - id: "adv-sandbox-003"
    description: "Symlink-style path notation must not bypass sandbox"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-project
          type: sandbox
          tool: "Read"
          within:
            - "/home/user/project"
          message: "Read restricted to project directory"

    envelope:
      tool_name: "Read"
      arguments:
        file_path: "/home/user/project/./../../../../etc/shadow"

    expected:
      verdict: denied
      message_contains: "project directory"

  - id: "adv-sandbox-004"
    description: "Path nested inside a dict arg must not be invisible to the sandbox"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "read_file"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "read_file"
      arguments:
        file:
          path: "/etc/passwd"

    expected:
      verdict: denied
      message_contains: "path outside sandbox"

  - id: "adv-sandbox-005"
    description: "Paths inside list args must not be invisible to the sandbox"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "read_file"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "read_file"
      arguments:
        paths: ["/etc/passwd", "/tmp/ok"]

    expected:
      verdict: denied
      message_contains: "path outside sandbox"

  - id: "adv-sandbox-006"
    description: "Relative traversal in a command string must be resolved and checked"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "Bash"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "Bash"
      arguments:
        command: "cat ../../etc/passwd"

    expected:
      verdict: denied
      message_contains: "path outside sandbox"

  - id: "adv-sandbox-007"
    description: "Variable expansion in a command must fail closed, not skip the check"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "Bash"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "Bash"
      arguments:
        command: "cat $HOME/.ssh/id_rsa"

    expected:
      verdict: denied

  - id: "adv-sandbox-008"
    description: "Tilde expansion in a command must be resolved and checked"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "Bash"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "Bash"
      arguments:
        command: "cat ~/.ssh/id_rsa"

    expected:
      verdict: denied
      message_contains: "path outside sandbox"

  - id: "adv-sandbox-009"
    description: "A command under a non-standard arg key (cmd) must still be checked"

    contract:
      apiVersion: edictum/v1
      kind: Ruleset
      metadata:
        name: test-bundle
      defaults:
        mode: enforce
      rules:
        - id: sandbox-zone
          type: sandbox
          tool: "custom_tool"
          within:
            - "/tmp/safe-zone"
          message: "path outside sandbox"

    envelope:
      tool_name: "custom_tool"
      arguments:
        cmd: "cat /etc/passwd"

    expected:
      verdict: denied
      message_contains: "path outside sandbox"
