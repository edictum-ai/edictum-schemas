[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edictum-schemas"
version = "0.1.0"
description = "Shared JSON Schema for Edictum rulesets and workflow documents"
license = "MIT"
requires-python = ">=3.11"
keywords = ["edictum", "schema", "json-schema", "contract", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/edictum-ai/edictum-schemas"

[tool.hatch.build.targets.wheel]
packages = ["src/edictum_schemas"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas" = "edictum_schemas/schemas"

[tool.hatch.build.targets.sdist]
include = ["src/edictum_schemas", "schemas"]

[tool.uv]
# Dependency cooldown: uv only picks files uploaded at least 15 days ago,
# including the tools CI adds with `uv run --with`. This matches Renovate's
# minimumReleaseAge in renovate.json. An advisory fix younger than 15 days
# goes in [tool.uv.exclude-newer-package] with its GHSA id and minimum
# fixing version in a comment.
exclude-newer = "15 days"
